<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TubeClone - Video Streaming</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --panel: #181818;
      --panel-soft: #202020;
      --light: #f1f1f1;
      --muted: #aaa;
      --line: #2f2f2f;
      --brand: #ff0033;
      --chip: #272727;
      --chip-active: #3a3a3a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body { min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    button, input, textarea { font: inherit; }
    img, video { max-width: 100%; display: block; }
    .hidden { display: none !important; }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding: 0 16px;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn, .icon-btn, .action-btn {
      border: none;
      background: transparent;
      color: var(--light);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 20px;
    }

    .menu-btn:hover, .icon-btn:hover, .action-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-size: 22px;
    }

    .logo {
      width: 34px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #ff2d2d, #ff0033);
      position: relative;
      box-shadow: 0 4px 12px rgba(255,0,51,0.3);
    }

    .logo:before {
      content: "";
      position: absolute;
      left: 11px;
      top: 6px;
      width: 0;
      height: 0;
      border-left: 11px solid white;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    .search-wrap {
      width: min(500px, 35vw);
      display: flex;
      align-items: center;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      height: 40px;
    }

    .search-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 0 16px;
      color: var(--light);
      font-size: 14px;
    }

    .search-wrap input::placeholder {
      color: var(--muted);
    }

    .search-wrap button {
      width: 60px;
      height: 100%;
      background: transparent;
      border: none;
      border-left: 1px solid var(--line);
      color: var(--light);
      cursor: pointer;
      font-size: 18px;
    }

    .upload {
      padding: 0 12px;
      height: 38px;
      border: none;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      color: var(--light);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .upload:hover { background: rgba(255,255,255,0.12); }

    .user-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #89a6ff, #5b56ff);
      font-weight: 700;
      cursor: pointer;
      border: none;
      color: white;
      font-size: 16px;
    }

    .main-layout {
      display: flex;
      flex: 1;
      gap: 0;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 12px 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.2);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0 8px;
      border-radius: 10px;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: var(--light);
    }

    .nav-item.active {
      background: rgba(255,255,255,0.1);
      color: var(--light);
      font-weight: 600;
    }

    .nav-item-icon { font-size: 22px; }

    .nav-divider {
      height: 1px;
      background: var(--line);
      margin: 10px 0;
    }

    .nav-section-title {
      padding: 14px 14px 8px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .filter-bar::-webkit-scrollbar { height: 6px; }
    .filter-bar::-webkit-scrollbar-track { background: transparent; }
    .filter-bar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }

    .chip {
      background: rgba(255,255,255,0.08);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--light);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-size: 14px;
    }

    .chip:hover { background: rgba(255,255,255,0.12); }

    .chip.active {
      background: var(--light);
      color: #000;
      border-color: var(--light);
      font-weight: 600;
    }

    .scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: var(--bg);
    }

    .scroll-container::-webkit-scrollbar { width: 12px; }
    .scroll-container::-webkit-scrollbar-track { background: transparent; }
    .scroll-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
    }
    .scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.25);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .video-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
      transform: translateY(-4px);
    }

    .thumb-wrap { position: relative; width: 100%; overflow: hidden; }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: linear-gradient(135deg, #1d1d1d, #4d4d4d);
      display: block;
    }

    .duration {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(0,0,0,0.8);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .video-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .video-title {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.4;
      margin: 0;
      color: var(--light);
    }

    .channel-info { font-size: 12px; color: var(--muted); }
    .video-stats { font-size: 12px; color: var(--muted); }

    .player-section {
      display: none;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .player-section.active { display: flex; }

    .big-player {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .big-player video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
    }

    .watch-info {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }

    .watch-details {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .watch-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .watch-title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .watch-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn-watch {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--light);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .action-btn-watch:hover {
      background: rgba(255,255,255,0.12);
    }

    .channel-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
    }

    .channel-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .channel-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff915b, #ff2d55);
      font-weight: 700;
      color: white;
      font-size: 18px;
    }

    .channel-text {
      display: flex;
      flex-direction: column;
    }

    .channel-name {
      font-weight: 600;
      font-size: 14px;
    }

    .channel-subs {
      font-size: 12px;
      color: var(--muted);
    }

    .subscribe-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 999px;
      background: var(--brand);
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .subscribe-btn:hover { background: #ff1a2e; }

    .description {
      padding: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      color: #d0d0d0;
    }

    .comments-sidebar {
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .comments-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .comment-form input {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      padding: 10px 12px;
      color: var(--light);
      outline: none;
      font-size: 13px;
    }

    .comment-form input:focus {
      border-color: rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
    }

    .comment-form button {
      background: var(--brand);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comments-list::-webkit-scrollbar { width: 6px; }
    .comments-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8d80ff, #5dd0ff);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .comment-content {
      flex: 1;
      min-width: 0;
    }

    .comment-author {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .comment-text {
      font-size: 12px;
      color: #d0d0d0;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.open { display: flex; }

    .modal-card {
      width: min(560px, 90vw);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 22px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: none;
      color: var(--light);
      cursor: pointer;
      font-size: 18px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--light);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .auth-tab.active {
      background: var(--light);
      color: #000;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-field label {
      font-size: 13px;
      font-weight: 600;
      color: #d0d0d0;
    }

    .form-field input, .form-field textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
      color: var(--light);
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
    }

    .form-field textarea {
      resize: vertical;
      min-height: 80px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .submit-btn:hover { background: #ff1a2e; }

    @media (max-width: 1200px) {
      .video-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      .watch-info { grid-template-columns: 1fr; }
      .comments-sidebar {
        border-left: none;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 900px) {
      .sidebar { width: 70px; }
      .nav-item {
        flex-direction: column;
        gap: 6px;
        padding: 10px 8px;
        font-size: 11px;
      }
      .nav-item span:first-child { font-size: 24px; }
      .brand { flex-direction: column; }
      .brand-name { display: none; }
      .nav-section-title, .nav-divider { display: none; }
      .video-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }

    @media (max-width: 640px) {
      .topbar { height: 50px; padding: 0 10px; }
      .search-wrap { display: none; }
      .sidebar { display: none; }
      .video-grid { grid-template-columns: 1fr; }
      .watch-title { font-size: 20px; }
      .player-section { gap: 12px; }
      .watch-actions { flex-wrap: wrap; }
      .action-btn-watch {
        font-size: 12px;
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="sidebarToggle" aria-label="Toggle menu">☰</button>
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <span class="brand-name">TubeClone</span>
        </div>
      </div>

      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Search videos..." />
        <button aria-label="Search">🔍</button>
      </div>

      <div class="topbar-right">
        <button class="icon-btn" aria-label="Notifications">🔔</button>
        <button class="upload" id="openUploadModal">
          <span>+</span> Upload
        </button>
        <button class="user-badge" id="openAuthModal" aria-label="Account">U</button>
      </div>
    </header>

    <div class="main-layout">
      <aside class="sidebar" id="sidebar">
        <div class="nav-item active">
          <span class="nav-item-icon">🏠</span>
          <span>Home</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon">🎬</span>
          <span>Shorts</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon">🔔</span>
          <span>Subscriptions</span>
        </div>

        <div class="nav-divider"></div>

        <div class="nav-item">
          <span class="nav-item-icon">📚</span>
          <span>Library</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon">⏱️</span>
          <span>Watch later</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon">👍</span>
          <span>Liked videos</span>
        </div>

        <div class="nav-divider"></div>

        <div class="nav-section-title">Explore</div>
        <div class="nav-item">
          <span class="nav-item-icon">🔥</span>
          <span>Trending</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon">🎵</span>
          <span>Music</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon">🎮</span>
          <span>Gaming</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon">📰</span>
          <span>News</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon">⚽</span>
          <span>Sports</span>
        </div>
      </aside>

      <div class="content-area">
        <div class="filter-bar">
          <button class="chip active" data-category="all">All</button>
          <button class="chip" data-category="music">Music</button>
          <button class="chip" data-category="gaming">Gaming</button>
          <button class="chip" data-category="technology">Technology</button>
          <button class="chip" data-category="education">Education</button>
          <button class="chip" data-category="sports">Sports</button>
          <button class="chip" data-category="travel">Travel</button>
          <button class="chip" data-category="food">Food</button>
          <button class="chip" data-category="fashion">Fashion</button>
        </div>

        <div class="scroll-container" id="scrollContainer">
          <section class="player-section" id="playerSection">
            <div class="big-player">
              <video id="mainVideo" controls></video>
            </div>

            <div class="watch-info">
              <div class="watch-details">
                <div class="watch-head">
                  <h2 class="watch-title" id="watchTitle">Video Title</h2>
                  <div class="watch-actions">
                    <button class="action-btn-watch">👍 <span id="likeCount">0</span></button>
                    <button class="action-btn-watch">👎</button>
                    <button class="action-btn-watch">🔗 Share</button>
                    <button class="action-btn-watch">💾 Save</button>
                  </div>
                </div>

                <div class="channel-section">
                  <div class="channel-meta">
                    <div class="channel-avatar" id="channelAvatar">C</div>
                    <div class="channel-text">
                      <div class="channel-name" id="channelName">Channel Name</div>
                      <div class="channel-subs" id="channelSubs">1M subscribers</div>
                    </div>
                  </div>
                  <button class="subscribe-btn">Subscribe</button>
                </div>

                <div class="description" id="description">Video description will appear here...</div>
              </div>
            </div>
          </section>

          <div class="video-grid" id="videoGrid"></div>
        </div>
      </div>

      <aside class="comments-sidebar" id="commentsSidebar">
        <h4 class="comments-title">Comments</h4>

        <div class="comment-form">
          <input id="commentInput" type="text" placeholder="Add a comment..." />
          <button id="submitComment">Post</button>
        </div>

        <div class="comments-list" id="commentsList"></div>
      </aside>
    </div>
  </div>

  <div class="modal" id="authModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Account</h3>
        <button class="close-btn" data-close="authModal">✕</button>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">Sign in</button>
        <button class="auth-tab" data-mode="signup">Create account</button>
      </div>

      <div id="loginPane">
        <form id="loginForm">
          <div class="form-field">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-field">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
          </div>
          <button class="submit-btn" type="submit">Sign in</button>
        </form>
      </div>

      <div id="signupPane" class="hidden">
        <form id="signupForm">
          <div class="form-field">
            <label>Full name</label>
            <input type="text" name="name" placeholder="Your name" required />
          </div>
          <div class="form-field">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-field">
            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required />
          </div>
          <button class="submit-btn" type="submit">Create account</button>
        </form>
      </div>
    </div>
  </div>

  <div class="modal" id="uploadModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Upload a video</h3>
        <button class="close-btn" data-close="uploadModal">✕</button>
      </div>

      <form id="uploadForm">
        <div class="form-field">
          <label>Video URL</label>
          <input type="url" name="videoUrl" placeholder="https://..." required />
        </div>

        <div class="form-field">
          <label>Video title</label>
          <input type="text" name="title" placeholder="My awesome video" required />
        </div>

        <div class="form-field">
          <label>Channel name</label>
          <input type="text" name="channel" placeholder="Your channel" required />
        </div>

        <div class="form-field">
          <label>Thumbnail URL</label>
          <input type="url" name="thumbnail" placeholder="https://..." />
        </div>

        <div class="form-field">
          <label>Description</label>
          <textarea name="description" placeholder="Tell viewers about your video..."></textarea>
        </div>

        <div class="form-field">
          <label>Category</label>
          <input type="text" name="category" placeholder="e.g., Music, Gaming, etc." required />
        </div>

        <button class="submit-btn" type="submit">Publish video</button>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "tubeclone-videos";
    const USER_KEY = "tubeclone-user";

    const sampleVideos = [
      {
        id: 1,
        title: "Big Buck Bunny - Full Movie",
        channel: "Peach Open Movie Project",
        description: "Big Buck Bunny is a short computer-animated comedy film about a hunter and three anthropomorphic rodents. It's free and open source. Created by the Blender Institute, this film demonstrates the capabilities of Blender, a free and open-source 3D computer graphics software.",
        views: "4.2M",
        uploaded: "5 years ago",
        duration: "9:56",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/BigBuckBunny.mp4",
        poster: "https://images.unsplash.com/photo-1535016120754-be0d1b98dc42?auto=format&fit=crop&w=500&q=60",
        category: "travel",
        comments: [
          { author: "Alex", text: "Classic animation masterpiece!" },
          { author: "Jordan", text: "Love this open-source project." }
        ]
      },
      {
        id: 2,
        title: "Elephant Dream - Surreal Animation",
        channel: "Blender Foundation",
        description: "Elephant Dream is an animated short film about a man, two robots, and a journey through a mysterious world. It was the first project of the Blender Foundation and showcases incredible 3D animation techniques and surreal visuals.",
        views: "2.8M",
        uploaded: "6 years ago",
        duration: "10:48",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/ElephantsDream.mp4",
        poster: "https://images.unsplash.com/photo-1606986628025-35d57e735ae0?auto=format&fit=crop&w=500&q=60",
        category: "technology",
        comments: [
          { author: "Sam", text: "Incredible visual effects!" },
          { author: "Casey", text: "Surreal and beautiful." }
        ]
      },
      {
        id: 3,
        title: "For Bigger Blazes - Action Packed",
        channel: "Android Developers",
        description: "A high-energy action video showcasing impressive effects and cinematic sequences. Perfect for understanding video production techniques and creative storytelling in motion.",
        views: "5.1M",
        uploaded: "3 years ago",
        duration: "15:34",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/ForBiggerBlazes.mp4",
        poster: "https://images.unsplash.com/photo-1538481143235-5d630a003475?auto=format&fit=crop&w=500&q=60",
        category: "gaming",
        comments: [
          { author: "Drake", text: "Explosive action sequences!" },
          { author: "Morgan", text: "Great video production." }
        ]
      },
      {
        id: 4,
        title: "For Bigger Joyrides - Adventure",
        channel: "Android Developers",
        description: "An exciting adventure video filled with thrilling moments and beautiful cinematography. Experience the joy of exploration through this dynamic visual journey.",
        views: "3.2M",
        uploaded: "2 years ago",
        duration: "12:18",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/ForBiggerJblazes.mp4",
        poster: "https://images.unsplash.com/photo-1489749798305-4fea3ba63d60?auto=format&fit=crop&w=500&q=60",
        category: "travel",
        comments: [
          { author: "Emma", text: "Makes me want to travel!" }
        ]
      },
      {
        id: 5,
        title: "Sintel - Fantasy Adventure",
        channel: "Blender Foundation",
        description: "Sintel is an animated fantasy short film about a girl and her quest in a magical world. It showcases stunning visuals, complex character animations, and an engaging fantasy storyline.",
        views: "8.9M",
        uploaded: "4 years ago",
        duration: "14:48",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/Sintel.mp4",
        poster: "https://images.unsplash.com/photo-1535016120754-be0d1b98dc42?auto=format&fit=crop&w=500&q=60",
        category: "education",
        comments: [
          { author: "Chris", text: "Amazing fantasy animation!" }
        ]
      },
      {
        id: 6,
        title: "Tears of Steel - Sci-Fi Masterpiece",
        channel: "Blender Foundation",
        description: "Tears of Steel is a science fiction short film featuring live-action actors and advanced visual effects. It demonstrates the intersection of live-action filmmaking and digital visual effects technology.",
        views: "6.7M",
        uploaded: "3 years ago",
        duration: "12:14",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/TearsOfSteel.mp4",
        poster: "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=60",
        category: "sports",
        comments: [
          { author: "Leo", text: "Incredible VFX!" }
        ]
      },
      {
        id: 7,
        title: "Google I/O Keynote 2019",
        channel: "Google Developers",
        description: "Watch Google's annual I/O developer conference keynote. Learn about the latest announcements in technology, AI, and Google's vision for the future of computing.",
        views: "1.5M",
        uploaded: "4 years ago",
        duration: "127:42",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/Google_Help_International_en.mp4",
        poster: "https://images.unsplash.com/photo-1516321497487-e288fb19713f?auto=format&fit=crop&w=500&q=60",
        category: "technology",
        comments: [
          { author: "Nina", text: "Great tech announcements!" }
        ]
      },
      {
        id: 8,
        title: "HTML5 Capabilities Tutorial",
        channel: "Web Dev Academy",
        description: "Learn about the powerful capabilities of HTML5 and how to build modern web applications. This video covers video playback, canvas, audio, and more.",
        views: "723K",
        uploaded: "5 years ago",
        duration: "18:22",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/VolkswagenGTIReview.mp4",
        poster: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=500&q=60",
        category: "education",
        comments: [
          { author: "Riley", text: "Perfect HTML5 guide!" }
        ]
      },
      {
        id: 9,
        title: "We Are Going On Land",
        channel: "Adventure Films",
        description: "An exploration video about land exploration and adventure. Experience the thrill of discovering new landscapes and environments.",
        views: "2.3M",
        uploaded: "3 years ago",
        duration: "19:33",
        source: "https://commondatastorage.googleapis.com/gtv-videos-library/sample/WeAreGoingOnBullrun.mp4",
        poster: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=500&q=60",
        category: "travel",
        comments: [
          { author: "Alex", text: "Beautiful exploration footage!" }
        ]
      }
    ];

    let videos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || sampleVideos;
    let currentUser = JSON.parse(localStorage.getItem(USER_KEY)) || null;
    let selectedVideoId = null;
    let currentCategory = "all";

    const videoGrid = document.getElementById("videoGrid");
    const scrollContainer = document.getElementById("scrollContainer");
    const mainVideo = document.getElementById("mainVideo");
    const watchTitle = document.getElementById("watchTitle");
    const channelName = document.getElementById("channelName");
    const channelSubs = document.getElementById("channelSubs");
    const description = document.getElementById("description");
    const commentsList = document.getElementById("commentsList");
    const commentInput = document.getElementById("commentInput");
    const playerSection = document.getElementById("playerSection");
    const commentsSidebar = document.getElementById("commentsSidebar");

    function saveVideos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
    }

    function getSelectedVideo() {
      return videos.find(v => v.id === selectedVideoId);
    }

    function formatDuration(seconds) {
      if (!seconds) return "0:00";
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);
      
      if (hrs > 0) {
        return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    function renderGrid(search = "") {
      const term = search.trim().toLowerCase();
      const filtered = videos.filter(video => {
        const matchesSearch =
          !term ||
          video.title.toLowerCase().includes(term) ||
          video.channel.toLowerCase().includes(term) ||
          video.description.toLowerCase().includes(term);

        const matchesCategory = currentCategory === "all" || video.category === currentCategory;
        return matchesSearch && matchesCategory;
      });

      if (!filtered.length) {
        videoGrid.innerHTML = "<div style='grid-column:1/-1;color:#aaa;padding:20px;'>No videos found.</div>";
        return;
      }

      videoGrid.innerHTML = filtered.map(video => `
        <article class="video-card" data-id="${video.id}">
          <div class="thumb-wrap">
            <img class="thumb" src="${video.poster}" alt="${video.title}" loading="lazy" />
            <span class="duration">${video.duration}</span>
          </div>
          <div class="video-body">
            <h3 class="video-title">${video.title}</h3>
            <div class="channel-info">${video.channel}</div>
            <div class="video-stats">${video.views} • ${video.uploaded}</div>
          </div>
        </article>
      `).join("");

      videoGrid.querySelectorAll(".video-card").forEach(card => {
        card.addEventListener("click", () => {
          selectedVideoId = Number(card.dataset.id);
          render();
          scrollContainer.scrollTop = 0;
        });
      });
    }

    function renderSelectedVideo() {
      const selected = getSelectedVideo();
      if (!selected) {
        playerSection.classList.remove("active");
        commentsSidebar.style.display = "none";
        return;
      }

      playerSection.classList.add("active");
      commentsSidebar.style.display = "flex";

      mainVideo.src = selected.source;
      mainVideo.poster = selected.poster;
      watchTitle.textContent = selected.title;
      channelName.textContent = selected.channel;
      channelSubs.textContent = `${(Math.random() * 5 + 0.5).toFixed(1)}M subscribers`;
      description.textContent = selected.description;

      renderComments(selected.comments || []);
    }

    function renderComments(comments) {
      if (!comments || !comments.length) {
        commentsList.innerHTML = "<div class='comment-item'><div class='comment-content'><div class='comment-author'>No comments</div><div class='comment-text'>Be the first to comment!</div></div></div>";
        return;
      }

      commentsList.innerHTML = comments.map(comment => `
        <div class="comment-item">
          <div class="comment-avatar">${(comment.author || "U").charAt(0).toUpperCase()}</div>
          <div class="comment-content">
            <div class="comment-author">${comment.author || "User"}</div>
            <div class="comment-text">${comment.text}</div>
          </div>
        </div>
      `).join("");
    }

    function render() {
      renderGrid(document.getElementById("searchInput").value);
      renderSelectedVideo();
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderGrid(e.target.value);
    });

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        currentCategory = chip.dataset.category;
        renderGrid(document.getElementById("searchInput").value);
      });
    });

    document.getElementById("submitComment").addEventListener("click", () => {
      const text = commentInput.value.trim();
      if (!text || !selectedVideoId) return;

      const current = getSelectedVideo();
      if (!current) return;

      const author = currentUser ? (currentUser.name || currentUser.email.split("@")[0]) : "Anonymous";
      current.comments = current.comments || [];
      current.comments.unshift({ author, text });
      saveVideos();
      renderComments(current.comments);
      commentInput.value = "";
    });

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const email = form.get("email").trim();
      currentUser = { name: email.split("@")[0], email };
      localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
      closeModal("authModal");
      render();
    });

    document.getElementById("signupForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const name = form.get("name").trim();
      const email = form.get("email").trim();
      currentUser = { name, email };
      localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
      closeModal("authModal");
      render();
    });

    document.querySelectorAll(".auth-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        const mode = tab.dataset.mode;
        document.querySelectorAll(".auth-tab").forEach(c => c.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("loginPane").classList.toggle("hidden", mode !== "login");
        document.getElementById("signupPane").classList.toggle("hidden", mode !== "signup");
      });
    });

    mainVideo.addEventListener('loadedmetadata', function() {
      const duration = Math.round(this.duration);
      const current = getSelectedVideo();
      if (current) {
        current.duration = formatDuration(duration);
        renderGrid(document.getElementById("searchInput").value);
      }
    });

    document.getElementById("uploadForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const newVideo = {
        id: Date.now(),
        title: form.get("title").trim() || "Untitled",
        channel: form.get("channel").trim() || "My Channel",
        description: form.get("description").trim() || "No description",
        views: "New",
        uploaded: "just now",
        duration: "0:00",
        source: form.get("videoUrl").trim(),
        poster: form.get("thumbnail").trim() || "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=500&q=60",
        category: form.get("category").trim().toLowerCase() || "all",
        comments: []
      };

      videos.unshift(newVideo);
      selectedVideoId = newVideo.id;
      saveVideos();
      render();
      e.target.reset();
      closeModal("uploadModal");
    });

    document.getElementById("openAuthModal").addEventListener("click", () => openModal("authModal"));
    document.getElementById("openUploadModal").addEventListener("click", () => openModal("uploadModal"));

    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => closeModal(btn.dataset.close));
    });

    document.querySelectorAll(".modal").forEach(modal => {
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("open");
      });
    });

    function openModal(id) {
      document.getElementById(id).classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    document.getElementById("sidebarToggle").addEventListener("click", () => {
      const sidebar = document.getElementById("sidebar");
      sidebar.style.display = sidebar.style.display === "none" ? "block" : "none";
    });

    if (!selectedVideoId && videos.length) {
      selectedVideoId = videos[0].id;
    }

    render();
  </script>
</body>
</html>
